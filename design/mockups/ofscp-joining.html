<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joining Groups</title>
<!--
  Mockup: joining groups in Social mode (docs/ofscp.md "Joining"; OFSCP §5.6,
  §5.7), in the style of ofscp-social.html and on its tokens.
  - All channels lists every group Postrinch knows of, from every account:
    the person's groups first, then groups asked to join and groups of
    channels followed without joining. Each group says where the account
    stands and offers the one thing to do: Join, Ask to join, or nothing
    (Asked, Invite only). Each channel can be followed.
  - "Join with a link…" in the header takes an invite link, says which
    provider holds the group before joining, and offers the group after.
  - A group the person may manage or moderate has ✎ on its row (on hover,
    as views do), opening its one panel where the view panel opens:
    invites (make, the link shown once with Copy, revoke) and requests to
    join (Refuse, then Approve rightmost).
-->
<style>
:root {
  --surface:#fff; --panel:#f4f5f7; --rail:#e9ebef; --ink:#16181d; --ink-2:#3a3f4a; --muted:#5b6170; --faint:#8a909c;
  --line:#dfe2e7; --line-soft:#eceef1; --field:#d4d8de; --hover:#eaecef; --row-hover:#f8f9fa;
  --accent:#2456b8; --accent-tint:#e6eefb; --accent-ink:#173d84; --mark:#fbe7b0; --scrim:rgba(10,12,16,.82);
  --warn-bg:#fdf4e3; --warn-line:#f0cf96; --trouble:#7a3f06;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#16181d; --panel:#1d2026; --rail:#121418; --ink:#e7e9ee; --ink-2:#c4c8d0; --muted:#949aa6; --faint:#6b717d;
  --line:#2d3139; --line-soft:#262a31; --field:#3a3f49; --hover:#2a2e36; --row-hover:#1f2329;
  --accent:#6f9cf0; --accent-tint:#1f2d48; --accent-ink:#b6cdf7; --mark:#5c4a12;
  --warn-bg:#3a2c12; --warn-line:#6b5220; --trouble:#f0b46a;
}}
:root[data-theme="dark"] {
  --surface:#16181d; --panel:#1d2026; --rail:#121418; --ink:#e7e9ee; --ink-2:#c4c8d0; --muted:#949aa6; --faint:#6b717d;
  --line:#2d3139; --line-soft:#262a31; --field:#3a3f49; --hover:#2a2e36; --row-hover:#1f2329;
  --accent:#6f9cf0; --accent-tint:#1f2d48; --accent-ink:#b6cdf7; --mark:#5c4a12;
  --warn-bg:#3a2c12; --warn-line:#6b5220; --trouble:#f0b46a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", "Inter", system-ui, sans-serif; }
.states { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.states button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--field); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.states button.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.note { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; color: var(--muted); font-size: 12.5px; }
.window { max-width: 1240px; margin: 10px auto 40px; display: grid; grid-template-columns: 68px 230px 1fr; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 680px; position: relative; }
.main { display: grid; grid-template-columns: 1fr; min-width: 0; overflow: hidden; }
.main.split { grid-template-columns: 320px 1fr; }
.main.thread { grid-template-columns: 1fr 340px; }
@media (max-width: 760px) { .window { grid-template-columns: 56px 1fr; height: auto; } .sidebar { display: none; } .main, .main.split, .main.thread { grid-template-columns: 1fr; } }
/* Modes rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
.mode { width: 56px; padding: 6px 0 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-2); font-size: 11px; cursor: pointer; position: relative; }
.mode svg { width: 22px; height: 22px; }
.mode:hover { background: var(--hover); }
.mode.on { background: var(--surface); color: var(--accent-ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.mode .badge { position: absolute; top: 2px; right: 6px; }
.rail .gap { flex: 1; }
/* Sidebar */
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.side-head { display: flex; align-items: center; padding: 2px 6px 8px 10px; font-weight: 700; font-size: 15px; }
.side-head span { flex: 1; }
.folder { min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: 6px; cursor: pointer; }
.folder:hover { background: var(--hover); }
.folder.chosen { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
.folder.unread .name { font-weight: 600; }
.folder .edit { display: none; color: var(--muted); font-size: 13px; padding: 0 4px; }
.folder:hover .edit { display: inline; } .folder:hover .count, .folder:hover .badge { display: none; }
.name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.badge { background: var(--accent); color: #fff; border-radius: 9px; font-size: 11px; font-weight: 600; padding: 0 6px; line-height: 17px; }
.glyph { width: 18px; color: var(--muted); text-align: center; flex-shrink: 0; font-size: 13px; }
.stack { display: inline-flex; flex-shrink: 0; } .stack .av { width: 16px; height: 16px; font-size: 8px; border: 1.5px solid var(--panel); margin-left: -5px; } .stack .av:first-child { margin-left: 0; }
.section { font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 12px 10px 4px; }
.line { height: 1px; background: var(--line); margin: 8px 4px; }
/* Avatars: pictures where people set one, initials otherwise */
.av { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background-size: cover; }
.av.sq { border-radius: 7px; }
.p1 { background: radial-gradient(circle at 50% 38%, #f3d2b3 0 26%, transparent 27%), radial-gradient(circle at 50% 100%, #c2621a 0 45%, transparent 46%), linear-gradient(#ffe3c2, #f7b37a); }
.p2 { background: radial-gradient(circle at 50% 38%, #d9b08c 0 26%, transparent 27%), radial-gradient(circle at 50% 100%, #3a3f4a 0 45%, transparent 46%), linear-gradient(#cfe0f5, #8fb3e3); }
.p3 { background: radial-gradient(circle at 50% 38%, #f0c9a5 0 26%, transparent 27%), radial-gradient(circle at 50% 100%, #2f8a55 0 45%, transparent 46%), linear-gradient(#e3f3d6, #a7d88c); }
.p4 { background: radial-gradient(circle at 50% 38%, #e8bf98 0 26%, transparent 27%), radial-gradient(circle at 50% 100%, #2456b8 0 45%, transparent 46%), linear-gradient(#e6e0f7, #b5a6e8); }
/* Header with the view's places as tabs */
.head { border-bottom: 1px solid var(--line-soft); padding: 10px 16px 0; }
.head-row { display: flex; align-items: center; gap: 10px; }
.head h2 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .sub { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; }
.tabs span { padding: 6px 10px; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs span.on { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.tabs span b { font-size: 11px; color: var(--accent); margin-left: 3px; }
.tabs .where { color: var(--faint); font-size: 11.5px; }
.ghost { height: 30px; border: 1px solid var(--field); border-radius: 6px; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 0 10px; }
.filter { width: 170px; height: 30px; border: 1px solid var(--field); border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); }
.write { width: 30px; height: 30px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
.pane { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--line); }
.scroll { overflow-y: auto; flex: 1; padding: 10px 14px; }
/* Messages */
.msg { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 5px 8px; border-radius: 6px; position: relative; }
.msg:hover { background: var(--row-hover); } .msg:hover .tools { display: flex; }
.msg.cont { padding-top: 0; } .msg.cont > .av { visibility: hidden; height: 0; }
.who { font-size: 13px; } .who b { font-weight: 600; } .who .h { color: var(--faint); margin-left: 4px; } .who time { color: var(--faint); margin-left: 8px; font-size: 12px; }
.place { display: inline-block; font-size: 11.5px; color: var(--ink-2); background: var(--hover); border-radius: 9px; padding: 0 7px; margin-left: 6px; }
.body .mention { background: var(--mark); border-radius: 3px; padding: 0 2px; }
.body code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.edited { color: var(--faint); font-size: 12px; }
.reacts { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reacts span { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; font-size: 12px; background: var(--surface); }
.reacts span.mine { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-ink); }
.replies { margin-top: 4px; font-size: 12.5px; color: var(--accent); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.tools { position: absolute; right: 8px; top: -10px; display: none; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.tools span { width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; color: var(--ink-2); }
.day { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); margin: 10px 0 6px; } .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
/* Media */
.media { display: grid; gap: 4px; margin-top: 6px; max-width: 460px; }
.media.two { grid-template-columns: 1fr 1fr; }
.pic { border-radius: 8px; height: 220px; cursor: zoom-in; position: relative; overflow: hidden; }
.media.two .pic { height: 160px; }
.pic.a { background: linear-gradient(160deg, #3b5b8c, #7fa3cf 45%, #e7c58f 46%, #b07c45); }
.pic.b { background: linear-gradient(200deg, #2f3a2a, #5c7a4a 50%, #a8b98a); }
.pic.c { background: linear-gradient(120deg, #6b4b7a, #c08aa8 60%, #f0d5c0); }
.video { border-radius: 8px; height: 230px; max-width: 420px; margin-top: 6px; background: linear-gradient(135deg, #1b1f2a, #34405a); position: relative; display: flex; align-items: center; justify-content: center; color: #fff; }
.video .play { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.video .bar { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; gap: 8px; align-items: center; font-size: 11.5px; }
.video .bar i { flex: 1; height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; }
.file { margin-top: 6px; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.file i { width: 28px; height: 28px; background: var(--hover); border-radius: 5px; display: inline-block; }
/* Composer (detail in ofscp-authoring.html) */
.composer { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
.box { border: 1px solid var(--field); border-radius: 8px; padding: 8px 10px; min-height: 42px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.box span { flex: 1; } .box .t { color: var(--muted); font-size: 15px; }
.send { height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 600; }
.to { font-size: 12px; color: var(--muted); margin-bottom: 5px; } .to b { color: var(--ink-2); }
/* Lists and readers */
.row { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; }
.row:hover { background: var(--row-hover); } .row.chosen { background: var(--accent-tint); }
.row .top { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; } .row .top b { color: var(--ink); } .row .top time { margin-left: auto; }
.row .title { font-weight: 600; margin: 2px 0; }
.row .snip { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .thumb { width: 64px; height: 48px; border-radius: 6px; grid-row: 2 / span 2; grid-column: 2; }
.row.unread .title::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 2px; }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); }
.article { max-width: 680px; }
.article .cover { height: 200px; border-radius: 10px; margin-bottom: 14px; }
.article h1 { font-size: 24px; margin: 4px 0 6px; }
.byline { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }
.article p { margin: 0 0 12px; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 9px; background: var(--hover); color: var(--ink-2); }
.banner { margin: 10px 14px 0; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; background: var(--accent-tint); color: var(--accent-ink); }
.presence { width: 9px; height: 9px; border-radius: 50%; background: #2f8a55; display: inline-block; border: 2px solid var(--surface); }
.presence.away { background: #c2621a; }
/* Lightbox and view panel */
.overlay { position: absolute; inset: 0; background: var(--scrim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; z-index: 3; }
.overlay .big { width: min(760px, 86%); height: 470px; border-radius: 6px; }
.overlay .cap { font-size: 13px; opacity: .85; display: flex; gap: 14px; }
.overlay .x { position: absolute; top: 14px; right: 18px; font-size: 22px; opacity: .8; }
.panel { position: absolute; top: 0; bottom: 0; left: 298px; width: 400px; background: var(--surface); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0,0,0,.12); padding: 16px 18px; z-index: 2; overflow-y: auto; }
.panel h3 { margin: 0 0 12px; font-size: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field select { font: inherit; padding: 6px 9px; border: 1px solid var(--field); border-radius: 6px; background: var(--surface); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid var(--field); border-radius: 6px; padding: 6px; }
.chip { font-size: 12.5px; background: var(--hover); border-radius: 12px; padding: 2px 8px; display: inline-flex; gap: 5px; align-items: center; }
.chip small { color: var(--faint); } .chip.add { background: none; color: var(--accent); }
.seg { display: flex; border: 1px solid var(--field); border-radius: 6px; overflow: hidden; } .seg span { flex: 1; text-align: center; padding: 5px 0; font-size: 13px; } .seg span.on { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
.checks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--field); background: var(--surface); color: var(--ink); }
.btn.filled { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.red { color: #a3271d; border-color: #a3271d; margin-right: auto; }
.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
svg { width: 16px; height: 16px; }
/* Joining */
.grp { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; position: relative; }
.grp .gname { font-weight: 600; } .grp .gsub { color: var(--muted); font-size: 12.5px; }
.grp .gedit { display: none; color: var(--muted); font-size: 13px; padding: 0 6px; cursor: pointer; }
.grp:hover .gedit { display: inline; }
.grp .stand { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.chan { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 58px; font-size: 13.5px; border-radius: 6px; cursor: pointer; }
.chan:hover { background: var(--row-hover); } .chan .cname { flex: 1; }
.chan .follow { font-size: 12px; color: var(--accent); } .chan .follow.on { color: var(--muted); }
.gsep { height: 1px; background: var(--line-soft); margin: 6px 14px; }
.pill { font-size: 11.5px; border-radius: 9px; padding: 0 8px; background: var(--hover); color: var(--ink-2); }
.dialog { position: absolute; left: 50%; top: 90px; transform: translateX(-50%); width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,.18); padding: 18px; z-index: 3; }
.dialog h3 { margin: 0 0 12px; font-size: 16px; }
.found { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
.trouble { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--trouble); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 4px; }
.sect { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; display: flex; align-items: center; }
.sect span { flex: 1; }
.inv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.inv small { color: var(--muted); font-size: 12px; }
.inv .btn { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.linkbox { display: flex; gap: 6px; align-items: center; border: 1px solid var(--accent); background: var(--accent-tint); border-radius: 8px; padding: 6px 6px 6px 10px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--accent-ink); }
.linkbox span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.req .said { color: var(--ink-2); font-size: 12.5px; grid-column: 2; }
.req .acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 6px; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
</style>
</head>
<body>
<div class="states" id="states"></div>
<p class="note" id="note"></p>
<div class="window" id="window"></div>
<script>
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  cal: svg('<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>'),
  social: svg('<path d="M21 14l-3-3h-7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v10"/><path d="M14 15v2a1 1 0 0 1-1 1H6l-3 3V11a1 1 0 0 1 1-1h2"/>'),
  gear: svg('<circle cx="12" cy="12" r="3"/>'),
};
const av = (p, l = '', cls = '') => `<span class="av ${p} ${cls}">${l}</span>`;
const sq = (l, c) => `<span class="av sq" style="background:${c}">${l}</span>`;
const rail = () => `<nav class="rail">
  <div class="mode">${I.mail}<span>Mail</span></div><div class="mode">${I.cal}<span>Calendar</span></div>
  <div class="mode on">${I.social}<span>Social</span></div><div class="gap"></div><div class="mode">${I.gear}<span>Settings</span></div></nav>`;
const g = (c) => `<span class="glyph">${c}</span>`;
const row = (glyph, name, tail = '', cls = '') => `<div class="folder ${cls}">${glyph}<span class="name">${name}</span>${tail}</div>`;
const sidebar = () => `<nav class="sidebar"><div class="side-head"><span>Social</span></div>
  ${row(g('⌂'), 'Home')}${row(g('@'), 'Mentions')}${row(g('✉'), 'Messages')}${row(g('✎'), 'Drafts')}
  <div class="section">Your views</div>${row(g('▤'), 'Rust Audio')}${row(g('▤'), 'Spec work')}
  <div class="line"></div>${row(g('#'), 'All channels', '', 'chosen')}
  <div class="folder" style="color:var(--muted)">${g('+')}<span class="name">New view…</span></div></nav>`;

const chan = (name, followed) => `<div class="chan">${g('#')}<span class="cname">${name}</span><span class="follow ${followed ? 'on' : ''}">${followed ? 'Following ✓' : 'Follow'}</span></div>`;
const grp = (o) => `<div class="grp">${sq(o.l, o.c)}<div><div class="gname">${o.name}${o.edit ? '<span class="gedit" data-panel title="Invites and requests">✎</span>' : ''}</div><div class="gsub">${o.sub}</div></div>
  <div class="stand">${o.stand}</div></div>${(o.chans || []).join('')}<div class="gsep"></div>`;
const groups = (joined) => [
  grp({ l: 'R', c: '#7a4fc2', name: 'Rust Audio', sub: 'forumall.app · you are an admin · 2 asking to join', edit: true, stand: '<span class="pill">Admin</span>', chans: [chan('general', true), chan('announcements', true), chan('standup', false)] }),
  grp({ l: 'O', c: '#2f8a55', name: 'OFSCP spec', sub: 'ofscp.org · member', stand: '<span class="pill">Member</span>', chans: [chan('drafts', false), chan('interop', true)] }),
  joined ? grp({ l: 'S', c: '#c2621a', name: 'Synth Makers', sub: 'sonic.example · member', stand: '<span class="pill">Member</span>', chans: [chan('blog', true), chan('gear', false)] }) : '',
  grp({ l: 'M', c: '#2456b8', name: 'Modular meetup', sub: 'sonic.example · takes requests', stand: '<span>Asked · waiting for its managers</span>' }),
  joined ? '' : grp({ l: 'S', c: '#c2621a', name: 'Synth Makers', sub: 'sonic.example · open to anyone', stand: '<button class="btn filled">Join</button>', chans: [chan('blog', true)] }),
  grp({ l: 'D', c: '#5b6170', name: 'DSP reading group', sub: 'forumall.app · takes requests', stand: '<button class="btn">Ask to join</button>', chans: [chan('papers', true)] }),
  grp({ l: 'P', c: '#a3271d', name: 'Pedal builders', sub: 'ofscp.org · invite only', stand: '<span>Invite only</span>', chans: [chan('schematics', true)] }),
].join('');
const all = (o = {}) => `${rail()}${sidebar()}<div class="main"><div class="pane">
  <div class="head" style="padding-bottom:10px"><div class="head-row"><h2>All channels<span class="sub">every group your accounts know</span></h2>
  <input class="filter" placeholder="Filter groups and channels"><button class="ghost" data-link>Join with a link…</button></div></div>
  ${o.banner || ''}<div class="scroll" style="padding:4px 0">${groups(o.joined)}</div></div></div>${o.over || ''}`;

const linkDialog = (step) => `<div class="dialog"><h3>Join with a link</h3>
  <div class="field"><label>Invite link</label><input value="https://sonic.example/invite/q3V9…xT2a"></div>
  ${step === 'used' ? '<div class="trouble">This invite has been used up. Ask whoever sent it for a new one.</div>'
    : '<div class="found">' + sq('?', '#8a909c') + '<div><b>An invite to a group on sonic.example</b><div class="hint" style="margin:0">Joining tells sonic.example who you are. The group\'s name shows once you are in.</div></div></div>'}
  <div class="field" style="margin-top:12px"><label>Join as</label><select><option>joe@forumall.app</option><option>joe@ofscp.org</option></select></div>
  <div class="actions"><button class="btn">Cancel</button><button class="btn filled">Join</button></div></div>`;
const joinedBanner = '<div class="banner" style="display:flex;align-items:center;gap:10px"><span style="flex:1">You joined <b>Synth Makers</b> on sonic.example, landing in # blog.</span><button class="btn">Add to a view…</button><button class="btn filled">Open # blog</button></div>';

const panel = (made) => `<div class="panel"><h3>Rust Audio<span class="sub" style="color:var(--muted);font-size:12.5px;font-weight:400;margin-left:8px">forumall.app</span></h3>
  <div class="sect"><span>Requests to join</span></div>
  <div class="req">${av('p2')}<div><b>Tomás</b> <span style="color:var(--faint)">@tomas@sonic.example · 2 h ago</span></div><div class="said">"I build the cpal backends, would love to follow along."</div><div class="acts"><button class="btn">Refuse</button><button class="btn filled">Approve</button></div></div>
  <div class="req">${av('p3')}<div><b>Ada</b> <span style="color:var(--faint)">@ada@ofscp.org · yesterday</span></div><div class="acts"><button class="btn">Refuse</button><button class="btn filled">Approve</button></div></div>
  <div class="sect"><span>Invites</span></div>
  ${made ? '<div class="linkbox"><span>https://forumall.app/invite/Hk2mQ8vZr1Lp0sYc4TnWfA</span><button class="btn filled">Copy</button></div><p class="hint">Shown once: copy it now. The invite stays below, to revoke.</p>' : ''}
  <div class="form2"><div class="field"><label>Lands in</label><select><option>No channel</option><option># general</option></select></div>
  <div class="field"><label>Role</label><select><option>Member</option><option>Moderator</option><option>Admin</option></select></div>
  <div class="field"><label>Uses</label><select><option>No limit</option><option>1</option><option>10</option><option>100</option></select></div>
  <div class="field"><label>Expires</label><select><option>Never</option><option>In a day</option><option>In a week</option><option>In 30 days</option></select></div></div>
  <div class="actions" style="margin-top:0"><button class="btn filled">Make an invite</button></div>
  ${made ? '<div class="inv"><span># general · member</span><small>0 of 10 used · expires in 7 days · by you, just now</small><button class="btn">Revoke</button></div>' : ''}
  <div class="inv"><span>member</span><small>14 used · never expires · by mira@forumall.app, 3 Nov</small><button class="btn">Revoke</button></div>
  <div class="actions"><button class="btn" data-close>Close</button></div></div>`;

const states = {
  all: { label: 'All channels', html: () => all(), note: 'Every group your accounts know, yours first. Each says where you stand and offers the one thing to do: Join for an open group, Ask to join for one that takes requests; Asked and Invite only offer nothing. Channels can be followed without joining; clicking one opens it. ✎ (on hover) on a group you manage opens its panel.' },
  link: { label: 'Join with a link', html: () => all({ over: linkDialog('found') }), note: 'Pasting a link says which provider holds the group before anything is sent; with several accounts you pick which joins. Join is rightmost.' },
  used: { label: 'Link refused', html: () => all({ over: linkDialog('used') }), note: 'An expired, revoked or used-up invite says so in the dialog, in the window\'s trouble colours.' },
  joined: { label: 'Joined', html: () => all({ joined: true, banner: joinedBanner }), note: 'After joining, a banner names the group and offers to open the channel the invite lands in, or add the group to a view. The group is now among yours.' },
  panel: { label: 'Group panel', html: () => all({ over: panel(false) }), note: 'The group\'s one panel, where the view panel opens: requests to join (Refuse, then Approve rightmost) and invites. Moderators who may not manage see only the requests.' },
  made: { label: 'Invite made', html: () => all({ over: panel(true) }), note: 'A new invite\'s link is shown once, with Copy; the provider never gives it again. The invite stays in the list to revoke.' },
};
const strip = document.getElementById('states');
function show(name) {
  const st = states[name], w = document.getElementById('window');
  w.innerHTML = st.html(); document.getElementById('note').textContent = st.note;
  strip.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.name === name));
  w.querySelectorAll('[data-link]').forEach(e => e.onclick = () => show('link'));
  w.querySelectorAll('[data-panel]').forEach(e => e.onclick = () => show('panel'));
  w.querySelectorAll('[data-close]').forEach(e => e.onclick = () => show('all'));
}
Object.keys(states).forEach(name => { const b = document.createElement('button'); b.textContent = states[name].label; b.dataset.name = name; b.onclick = () => show(name); strip.appendChild(b); });
show('all');
</script>
</body>
</html>
