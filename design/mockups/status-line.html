<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Line</title>
<!--
  Mockup: sync status as one small line at the foot of the left pane, in
  every mode (Mail, Calendar, and Social when it comes), after Joe's note
  of 2026-11-26: "This area is too big, status in any mode needs to be a
  small, one-line box on the bottom of the left pane."
  - It replaces the sidebar's Sync section (a heading, then each account's
    address and line, and a bar while downloading).
  - The line sums up every account: "Up to date", "Syncing 2 of 3
    accounts…" (with a thin bar under it while mail downloads), "1 account
    needs sign-in" or "Sync is off" in the trouble colour.
  - A click (or Enter) opens each account's own line above it, as the Sync
    section showed them, with "Sign in again…" on an account that needs
    it. Escape or a click outside closes it.
  Colours are the window's own (crates/postrinch/src/ui/palette.rs).
-->
<style>
:root {
  --surface:#fff; --panel:#f4f5f7; --rail:#e9ebef; --ink:#16181d; --ink-2:#3a3f4a; --muted:#5b6170; --faint:#8a909c;
  --line:#dfe2e7; --field:#d4d8de; --hover:#eaecef; --accent:#2456b8; --accent-tint:#e6eefb; --accent-ink:#173d84;
  --trouble:#7a3f06; --warn-bg:#fdf4e3; --warn-line:#f0cf96;
}
@media (prefers-color-scheme: dark) { :root {
  --surface:#16181d; --panel:#1d2026; --rail:#121418; --ink:#e7e9ee; --ink-2:#c4c8d0; --muted:#949aa6; --faint:#6b717d;
  --line:#2d3139; --field:#3a3f49; --hover:#2a2e36; --accent:#6f9cf0; --accent-tint:#1f2d48; --accent-ink:#b6cdf7;
  --trouble:#f0b46a; --warn-bg:#3a2c12; --warn-line:#6b5120;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", "Inter", system-ui, sans-serif; }
.states { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.states button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--field); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.states button.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.note { max-width: 900px; margin: 12px auto 0; padding: 0 16px; color: var(--muted); font-size: 12.5px; }
.window { max-width: 900px; margin: 10px auto 40px; display: grid; grid-template-columns: 68px 260px 1fr; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 560px; }
.rail { background: var(--rail); border-right: 1px solid var(--line); }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px 8px; display: flex; flex-direction: column; gap: 2px; position: relative; min-height: 0; }
.folder { min-height: 30px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; color: var(--ink-2); }
.folder.chosen { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
.fill { flex: 1; }
.main { padding: 24px; color: var(--muted); }
/* The status line */
.status { position: relative; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; width: 100%; text-align: left; overflow: hidden; }
.status:hover { background: var(--hover); }
.status .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.status.working .mark { background: var(--accent); }
.status.trouble { background: var(--warn-bg); border-color: var(--warn-line); color: var(--trouble); font-weight: 600; }
.status.trouble .mark { background: var(--trouble); }
.status .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .caret { color: var(--faint); font-size: 10px; }
.status .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line); }
.status .bar i { display: block; height: 100%; background: var(--accent); }
/* Each account's line, opened above the status line */
.detail { position: absolute; left: 8px; right: 8px; bottom: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.detail .off { color: var(--trouble); font-size: 12.5px; }
.acct { display: flex; flex-direction: column; gap: 3px; }
.acct .addr { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.acct .addr .dot { width: 8px; height: 8px; border-radius: 2px; }
.acct .ln { font-size: 12px; color: var(--muted); }
.acct .ln.trouble { color: var(--trouble); }
.acct .progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.acct .progress i { display: block; height: 100%; background: var(--accent); }
.acct button { align-self: flex-start; margin-top: 3px; font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--field); background: var(--surface); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="states" id="states"></div>
<p class="note" id="note"></p>
<div class="window">
  <nav class="rail"></nav>
  <nav class="sidebar">
    <div class="folder chosen">Inbox</div><div class="folder">Everything else</div><div class="folder">All mail</div>
    <div class="folder">Sent</div><div class="folder">Drafts</div>
    <div class="fill"></div>
    <div id="detail"></div>
    <button class="status" id="status" aria-haspopup="dialog"></button>
  </nav>
  <div class="main">The list and the reader.</div>
</div>
<script>
const A = [['sam@example.com', '#7b4fc2'], ['sam@lindenworks.example', '#c25a1f'], ['sam@fastmail.example', '#2f8a55']];
const acct = (i, line, o = {}) => `<div class="acct"><div class="addr"><span class="dot" style="background:${A[i][1]}"></span>${A[i][0]}</div>
  <div class="ln ${o.trouble ? 'trouble' : ''}">${line}</div>${o.p != null ? `<div class="progress"><i style="width:${o.p}%"></i></div>` : ''}
  ${o.signIn ? '<button>Sign in again…</button>' : ''}</div>`;
const S = {
  idle: { label: 'Up to date', cls: '', text: 'Up to date', note: 'Every account is up to date: a grey mark and one quiet line.',
    detail: acct(0, 'Up to date') + acct(1, 'Up to date') + acct(2, 'New mail up to date') },
  working: { label: 'Syncing', cls: 'working', text: 'Syncing 2 of 3 accounts…', bar: 62, note: 'Two accounts are syncing. While mail downloads, a thin bar along the foot shows all of it together.',
    detail: acct(0, 'Downloading 1,240 of 2,000 messages', { p: 62 }) + acct(1, 'Checking for new mail') + acct(2, 'Up to date') },
  signin: { label: 'Needs sign-in', cls: 'trouble', text: '1 account needs sign-in', note: 'Trouble takes the warning colours. The account that needs it has "Sign in again…" right there.',
    detail: acct(0, 'Up to date') + acct(1, 'Needs to sign in', { trouble: true, signIn: true }) + acct(2, 'Up to date') },
  trouble: { label: 'Other trouble', cls: 'trouble', text: 'Trouble with 1 account', note: 'Other trouble counts the accounts it touches; each account\'s own line says what went wrong and when it is tried again.',
    detail: acct(0, 'Could not sync; trying again in 30 s', { trouble: true }) + acct(1, 'Up to date') + acct(2, 'Up to date') },
  off: { label: 'Sync is off', cls: 'trouble', text: 'Sync is off', note: 'When sync cannot run at all, the line says so, and the reason heads the detail.',
    detail: '<div class="off">No Google sign-in client is set up, so sync is off.</div>' },
};
let on = 'idle', open = false;
function draw() {
  const s = S[on];
  document.getElementById('states').innerHTML = Object.entries(S).map(([k, v]) => `<button class="${k === on ? 'on' : ''}" data-k="${k}">${v.label}</button>`).join('')
    + `<button class="${open ? 'on' : ''}" data-open>Detail open</button>`;
  document.getElementById('note').textContent = s.note;
  const st = document.getElementById('status');
  st.className = `status ${s.cls}`;
  st.innerHTML = `<span class="mark"></span><span class="text">${s.text}</span><span class="caret">${open ? '▾' : '▴'}</span>`
    + (s.bar != null ? `<span class="bar"><i style="width:${s.bar}%"></i></span>` : '');
  document.getElementById('detail').innerHTML = open ? `<div class="detail" role="dialog" aria-label="Sync">${s.detail}</div>` : '';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (b) { on = b.dataset.k; draw(); return; }
  if (e.target.closest('[data-open]') || e.target.closest('#status')) { open = !open; draw(); return; }
  if (!e.target.closest('.detail')) { open = false; draw(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) { open = false; draw(); } });
draw();
</script>
</body>
</html>
