<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 13 42 38" role="img" aria-label="Postrinch">
  <title>Postrinch</title>
  <!-- A paper plane flying up and right; its tail is an open-end wrench that
       leaves the plane at one point, the back of the keel, along the plane's
       centre line. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- The wrench, behind the plane: an outline pass, then a fill pass, so
         handle and head share one outline. -->
    <g transform="translate(16.7 43.6) rotate(-38) scale(1.15)">
      <g fill="#173d84" stroke="#173d84" stroke-width="3">
        <rect x="2" y="-1.15" width="9.5" height="2.3" rx="1.15"/>
        <path d="M-2.95 -1.7 A3.4 3.4 0 1 1 -2.95 1.7 L-0.3 1.7 L-0.3 -1.7 Z"/>
      </g>
      <g fill="#bcd4f6">
        <rect x="2" y="-1.15" width="9.5" height="2.3" rx="1.15"/>
        <path d="M-2.95 -1.7 A3.4 3.4 0 1 1 -2.95 1.7 L-0.3 1.7 L-0.3 -1.7 Z"/>
      </g>
    </g>
    <!-- The plane: left wing, the keel's fold, right wing; all meet at the
         nose, and the keel and right wing meet the wrench at the tail. -->
    <g stroke="#173d84" stroke-width="2">
      <path d="M48 18.5 L15.5 29 L24 32.8 Z" fill="#bcd4f6"/>
      <path d="M48 18.5 L24 32.8 L25.4 36.8 Z" fill="#2456b8"/>
      <path d="M48 18.5 L25.4 36.8 L31.6 44 Z" fill="#bcd4f6"/>
    </g>
  </g>
</svg>
