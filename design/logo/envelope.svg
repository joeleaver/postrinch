<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 8 40 48" role="img" aria-label="Postrinch">
  <title>Postrinch</title>
  <!-- An open envelope with an open-end wrench rising out of it, jaw up. -->
  <g stroke="#173d84" stroke-linejoin="round" stroke-linecap="round">
    <!-- Inside of the envelope's back. -->
    <path d="M15.5 33 L25 26 L39 26 L48.5 33" fill="#ffffff" stroke-width="2"/>
    <!-- The wrench: outline pass, then fill pass. -->
    <g transform="translate(32 17.8) rotate(90) scale(1.75)">
      <g fill="#173d84" stroke="#173d84" stroke-width="2">
        <rect x="2" y="-1.15" width="17" height="2.3" rx="1.15"/>
        <path d="M-2.95 -1.7 A3.4 3.4 0 1 1 -2.95 1.7 L-0.3 1.7 L-0.3 -1.7 Z"/>
      </g>
      <g fill="#bcd4f6" stroke="none">
        <rect x="2" y="-1.15" width="17" height="2.3" rx="1.15"/>
        <path d="M-2.95 -1.7 A3.4 3.4 0 1 1 -2.95 1.7 L-0.3 1.7 L-0.3 -1.7 Z"/>
      </g>
    </g>
    <!-- The envelope's front: the side flaps, then the bottom flap. -->
    <path d="M15.5 33 L32 45.5 L48.5 33 L48.5 54 L15.5 54 Z" fill="#4a86e8" stroke-width="2"/>
    <path d="M15.5 54 L32 41.5 L48.5 54 Z" fill="#6ea2f2" stroke-width="2"/>
  </g>
</svg>
