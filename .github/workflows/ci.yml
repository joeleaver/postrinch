name: CI

# Every push and pull request is tested on Linux. Windows and macOS run
# only on a major release tag (`v1.0.0`, `v2.0.0`…): early in development
# their minutes (twice and ten times Linux's) are not worth spending on
# every push.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.0.0']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rinch's desktop shell builds against GTK (its native menus) and
      # libxdo on Linux; the same list rinch's own CI installs.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
