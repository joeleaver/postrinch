name: Release

on:
  push:
    tags:
      - "v*"
  # Builds and checks the package from a branch without releasing it: the
  # release job runs for a tag only.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # One package per system (DESIGN.md, "Installing and updating"). The
  # three programs ship together: the bridge and the app speak a wire format
  # that must match. The window is built without the `debug` feature.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GTK and libxdo for rinch's desktop shell. The GPU renderer (wgpu)
      # needs nothing here: it loads Vulkan at run time.
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Postrinch's own Google client is built in (google/config.rs). A
      # release without it could not sign in to Google, so a tag needs it.
      - name: Build (release)
        env:
          POSTRINCH_GOOGLE_CLIENT: ${{ secrets.POSTRINCH_GOOGLE_CLIENT }}
        run: |
          if [ -z "$POSTRINCH_GOOGLE_CLIENT" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "POSTRINCH_GOOGLE_CLIENT is not set: gh secret set POSTRINCH_GOOGLE_CLIENT < the client's JSON" >&2
            exit 1
          fi
          cargo build --release --locked -p postrinch -p postrinch-mcp -p postrinch-cli

      # A tag must name the version the programs carry, or every installed
      # copy would offer the same update again after restarting into it.
      - name: Check the tag names the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(target/release/postrinch --version | awk '{print $2}')"
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but the programs are $built: bump [workspace.package] version" >&2
            exit 1
          fi

      - name: Package
        run: tools/package.sh "" target/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: error

  # The zip the installed app updates itself from, and the per-user Setup
  # (tools/windows/postrinch.iss) that installs it where the updater keeps
  # it current. Nothing to install first: rinch's Windows shell needs only
  # the MSVC toolchain the runner carries. Check a change locally with
  # `cargo xwin check --workspace --target x86_64-pc-windows-msvc` (it needs
  # `llvm-lib` on the PATH).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The same Google client as Linux's build, and the same guard.
      - name: Build (release)
        shell: bash
        env:
          POSTRINCH_GOOGLE_CLIENT: ${{ secrets.POSTRINCH_GOOGLE_CLIENT }}
        run: |
          if [ -z "$POSTRINCH_GOOGLE_CLIENT" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "POSTRINCH_GOOGLE_CLIENT is not set: gh secret set POSTRINCH_GOOGLE_CLIENT < the client's JSON" >&2
            exit 1
          fi
          cargo build --release --locked -p postrinch -p postrinch-mcp -p postrinch-cli

      - name: Check the tag names the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          . tools/windows/invoke.ps1
          $built = (Invoke-Program target/release/postrinch.exe --version).Out.Split(" ")[1]
          if ("v$built" -ne $env:GITHUB_REF_NAME) {
            throw "the tag is $env:GITHUB_REF_NAME but the programs are ${built}: bump [workspace.package] version"
          }

      - name: Package
        shell: pwsh
        run: |
          tools/windows/package.ps1 -BinDir target/release -OutDir dist
          . tools/windows/invoke.ps1
          $version = (Invoke-Program target/release/postrinch.exe --version).Out.Split(" ")[1]
          if (-not $version) { throw "postrinch.exe --version named no version" }
          "version=$version" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:version" "/DStage=$PWD\dist\installer-stage" "/DOutDir=$PWD\dist" tools\windows\postrinch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The runner is a real Windows: install from the Setup and look, then
      # uninstall and look again; then install from the zip as `--install`
      # does, which must leave the same (marker, Start-menu entry, one PATH
      # entry, Apps & features), twice over, and `--uninstall` it; then a
      # PATH entry the person made themselves, which nothing removes.
      - name: Check the installer and the zip
        shell: pwsh
        run: |
          . tools/windows/invoke.ps1
          $app = "$env:LOCALAPPDATA\Programs\Postrinch"
          $programs = "postrinch.exe", "postrinch-mcp.exe", "postrinch-cli.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Postrinch.lnk"
          $uninstall = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $setupKey = "$uninstall\{18A87A0C-8DA8-4CF8-98D3-AE6B5E169DF9}_is1"
          $zipKey = "$uninstall\Postrinch"
          function User-Path { (Get-ItemProperty HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path }
          function Path-Entries { @((User-Path) -split ';' | Where-Object { $_.TrimEnd('\') -ieq $app }).Count }
          function Check-Install($how, $entryKey) {
            foreach ($f in $programs + "postrinch-install.json") {
              if (-not (Test-Path "$app\$f")) { throw "$how did not put $f in $app" }
            }
            $marker = Get-Content "$app\postrinch-install.json" | ConvertFrom-Json
            if ($marker.version -ne $env:version) { throw "$how wrote a marker saying $($marker.version), not $env:version" }
            $said = (Invoke-Program "$app\postrinch.exe" --version).Out
            if ($said -ne "postrinch $env:version") { throw "the installed window says '$said'" }
            if (-not (Test-Path $lnk)) { throw "$how made no Start-menu entry" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            if ($target -ine "$app\postrinch.exe") { throw "$how's Start-menu entry starts '$target'" }
            if ((Path-Entries) -ne 1) { throw "$how left $(Path-Entries) PATH entries for $app in '$(User-Path)'" }
            $shown = (Get-ItemProperty $entryKey -ErrorAction SilentlyContinue).DisplayVersion
            if ($shown -ne $env:version) { throw "Apps & features shows '$shown' for $how" }
          }
          # An uninstaller's last steps (the Setup's [Code], its own files)
          # come after postrinch.exe is gone: every condition is waited for,
          # up to a minute, before one is called a failure.
          function Check-Gone($how) {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $left = @()
              if (Test-Path "$app\postrinch.exe") { $left += "postrinch.exe" }
              if ((Test-Path "$app\unins000.exe") -or (Uninstaller-Running)) { $left += "the Setup's uninstaller" }
              if (Test-Path $lnk) { $left += "the Start-menu entry" }
              if ((Path-Entries) -ne 0) { $left += "$app on the PATH ('$(User-Path)')" }
              if ((Test-Path $setupKey) -or (Test-Path $zipKey)) { $left += "Postrinch in Apps & features" }
              if (Test-Path HKCU:\Software\Postrinch) { $left += "HKCU\Software\Postrinch" }
              if ($left.Count -eq 0) { return }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            throw "$how left $($left -join ', ')"
          }
          # The Setup's uninstaller works from a copy of itself in %TEMP%
          # (`_iu*.tmp`); it is done when that copy has exited.
          function Uninstaller-Running { @(Get-Process | Where-Object { $_.ProcessName -like '_iu*' }).Count -gt 0 }
          function Wait-SetupUninstalled {
            $deadline = (Get-Date).AddSeconds(60)
            while (((Uninstaller-Running) -or (Test-Path "$app\unins000.exe") -or (Test-Path $setupKey)) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if ((Uninstaller-Running) -or (Test-Path "$app\unins000.exe") -or (Test-Path $setupKey)) { throw "the Setup's uninstaller did not finish" }
          }

          $setup = "dist/postrinch-$env:version-windows-x86_64-setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Check-Install "the Setup" $setupKey
          # The uninstaller hands over to a copy of itself and returns at
          # once; Check-Gone waits for it to have done its work.
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Check-Gone "the Setup's uninstaller"

          $unpacked = "$env:RUNNER_TEMP\postrinch-zip"
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf "dist/postrinch-$env:version-windows-x86_64.zip" -C $unpacked
          if ($LASTEXITCODE -ne 0) { throw "the system's tar could not unpack the zip" }
          foreach ($time in "once", "twice") {
            $run = Invoke-Program "$unpacked\postrinch.exe" --install
            Write-Host $run.Out
            if ($run.Code -ne 0) { throw "postrinch.exe --install ($time) failed ($($run.Code))" }
            Check-Install "postrinch.exe --install ($time)" $zipKey
          }
          $quiet = (Get-ItemProperty $zipKey).QuietUninstallString
          if ($quiet -ne "`"$app\postrinch.exe`" --uninstall --quiet") { throw "the zip install's quiet uninstaller is '$quiet'" }
          $run = Invoke-Program "$app\postrinch.exe" --uninstall --quiet
          Write-Host $run.Out
          if ($run.Code -ne 0) { throw "postrinch.exe --uninstall failed ($($run.Code))" }
          Check-Gone "postrinch.exe --uninstall"

          # The person's own entry, written their way: it stays through an
          # install and an uninstall by either route.
          $theirs = "C:\Tools;$($app.ToUpper())\"
          Set-ItemProperty HKCU:\Environment -Name Path -Value $theirs -Type ExpandString
          foreach ($run in (Invoke-Program "$unpacked\postrinch.exe" --install), (Invoke-Program "$app\postrinch.exe" --uninstall --quiet)) {
            if ($run.Code -ne 0) { throw "with the person's PATH entry: $($run.Out) $($run.Err)" }
          }
          if ((User-Path) -ne $theirs) { throw "--install and --uninstall changed the person's PATH to '$(User-Path)'" }
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ((User-Path) -ne $theirs) { throw "the Setup changed the person's PATH to '$(User-Path)'" }
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Wait-SetupUninstalled
          if ((User-Path) -ne $theirs) { throw "an uninstall changed the person's PATH to '$(User-Path)'" }
          Write-Host "Setup and zip: marker $env:version, Start-menu entry, one PATH entry, Apps & features; both uninstalled cleanly; the person's own PATH entry kept"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Gather the packages
        run: |
          mkdir -p release
          find packages -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} release/ \;
          ls -la release

      # Each package gets a detached Ed25519 signature beside it, which the
      # installed app verifies before it stages an update. No key, no
      # release: an unsigned package would be refused by every install.
      - name: Sign packages
        env:
          SIGNING_KEY: ${{ secrets.POSTRINCH_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "POSTRINCH_UPDATE_SIGNING_KEY is not set: run tools/update-key.sh once" >&2
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          for package in release/*.tar.gz release/*.zip release/*-setup.exe; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$package" -out "$package.sig"
          done
          ls -la release

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
