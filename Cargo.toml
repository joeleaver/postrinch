[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/postrinch"

[workspace.dependencies]
postrinch-agents = { path = "crates/postrinch-agents" }
postrinch-commands = { path = "crates/postrinch-commands" }
postrinch-model = { path = "crates/postrinch-model" }
postrinch-render = { path = "crates/postrinch-render" }
postrinch-store = { path = "crates/postrinch-store" }
postrinch-sync = { path = "crates/postrinch-sync" }
postrinch-update = { path = "crates/postrinch-update" }

# rinch, from its repository's main branch: rinch-html (HtmlView, the
# cleaner) and rinch-visual-test's html-compare came in with rinch#2213.
rinch = { git = "https://github.com/joeleaver/rinch.git" }
rinch-html = { git = "https://github.com/joeleaver/rinch.git" }
rinch-visual-test = { git = "https://github.com/joeleaver/rinch.git" }

# rhypedb, from its repository. The ONNX/fastembed stack stays off until
# semantic search turns it on deliberately.
rhypedb-engine = { git = "https://github.com/joeleaver/rhypedb", default-features = false }
rhypedb-query = { git = "https://github.com/joeleaver/rhypedb", default-features = false }
rhypedb-schema = { git = "https://github.com/joeleaver/rhypedb" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
zstd = "0.14"
