[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.38"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/postrinch"

[workspace.dependencies]
postrinch-agents = { path = "crates/postrinch-agents" }
postrinch-commands = { path = "crates/postrinch-commands" }
postrinch-discover = { path = "crates/postrinch-discover" }
postrinch-log = { path = "crates/postrinch-log" }
postrinch-model = { path = "crates/postrinch-model" }
postrinch-render = { path = "crates/postrinch-render" }
postrinch-rules = { path = "crates/postrinch-rules" }
postrinch-store = { path = "crates/postrinch-store" }
postrinch-sync = { path = "crates/postrinch-sync" }
postrinch-sync-core = { path = "crates/postrinch-sync-core" }
postrinch-thunderbird = { path = "crates/postrinch-thunderbird" }
postrinch-update = { path = "crates/postrinch-update" }

# rinch: rinch-html (HtmlView, the cleaner) and rinch-visual-test's
# html-compare came in with rinch#2213. On the branch of rinch#3094
# (rinch-html's `Policy::allow`, which OFSCP bodies are cleaned with), cut
# from the rev this lock had, until it is merged; then back to main.
rinch = { git = "https://github.com/joeleaver/rinch.git", branch = "postrinch/html-allow-list" }
rinch-html = { git = "https://github.com/joeleaver/rinch.git", branch = "postrinch/html-allow-list" }
rinch-visual-test = { git = "https://github.com/joeleaver/rinch.git", branch = "postrinch/html-allow-list" }

# The OFSCP protocol core, shared with Joe's provider (docs/ofscp.md,
# "Shared with re-ofscp"): re-ofscp #28, with the WebSocket frames.
ofscp-core = { git = "https://github.com/joeleaver/re-ofscp", rev = "1ede95513191a6233415609a5987c46cdaeba449" }

# rhypedb v0.2.1: link-peer ordering (rhypedb#52, #55) and the
# generation-race fix for relation copies (rhypedb#54, #56). The
# ONNX/fastembed stack stays off until semantic search turns it on
# deliberately.
rhypedb-engine = { git = "https://github.com/joeleaver/rhypedb", tag = "v0.2.1", default-features = false }
rhypedb-schema = { git = "https://github.com/joeleaver/rhypedb", tag = "v0.2.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"
