[package]
name = "postrinch-ofscp"
description = "Postrinch's OFSCP transport: signed HTTPS to each provider and its WebSocket, on ofscp-core. No store, no Postrinch types."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ofscp-core = { workspace = true }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
httpdate = "1"
percent-encoding = "2"
jiff = { version = "0.2", features = ["std"] }
# Device keys are generated with the OS's randomness, in the rand_core
# version ofscp-core (ed25519-dalek 2) takes.
rand_core = { version = "0.6", features = ["getrandom"] }
# HTTPS: rustls with aws-lc-rs and the platform's verifier (reqwest's
# default), as the rest of Postrinch. `stream` sends uploads as they are read.
reqwest = { version = "0.13", features = ["stream"] }
# The WebSocket's TLS: the same stack, set up by hand, since the socket is
# opened over our own TLS stream.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
