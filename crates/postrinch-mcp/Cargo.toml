[package]
name = "postrinch-mcp"
description = "An MCP server over stdio: an agent reads and changes the person's mail through the running Postrinch app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "postrinch-mcp"
path = "src/main.rs"

[dependencies]
postrinch-agents = { workspace = true }
postrinch-commands = { workspace = true }
postrinch-model = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "macros"] }
schemars = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
