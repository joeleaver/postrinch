[package]
name = "postrinch-render-compare"
description = "Development tool: real mail drawn by Postrinch (rinch) beside the same mail drawn by Chrome, to find what renders badly and why."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "render-compare"
path = "src/main.rs"

[dependencies]
postrinch-commands = { workspace = true }
postrinch-render = { workspace = true }
postrinch-store = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking"] }
rinch = { workspace = true, features = ["desktop", "components", "theme", "debug", "html"] }
rinch-html = { workspace = true }
rinch-visual-test = { workspace = true, features = ["html-compare"] }
