[package]
name = "postrinch-render-compare"
description = "Development tool: real mail drawn by Postrinch (rinch) beside the same mail drawn by Chrome, to find what renders badly and why."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "render-compare"
path = "src/main.rs"

[dependencies]
postrinch-commands = { workspace = true }
postrinch-model = { workspace = true }
postrinch-render = { workspace = true }
postrinch-store = { workspace = true }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", features = ["blocking"] }
rinch = { git = "https://github.com/joeleaver/rinch.git", features = ["desktop", "components", "theme", "debug"] }
rinch-visual-test = { git = "https://github.com/joeleaver/rinch.git" }
serde = { workspace = true }
serde_json = { workspace = true }
