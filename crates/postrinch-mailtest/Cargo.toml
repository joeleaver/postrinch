[package]
name = "postrinch-mailtest"
description = "A fake IMAP and SMTP server, in memory on loopback ports, for tests that must never touch a real mailbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
thiserror = { workspace = true }
tokio = { version = "1.54", features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[dev-dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
tokio = { version = "1.54", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }
