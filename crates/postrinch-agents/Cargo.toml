[package]
name = "postrinch-agents"
description = "Postrinch's agents: their keys and reach, and the loopback link between postrinch-mcp and the app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
postrinch-commands = { workspace = true }
postrinch-model = { workspace = true }
base64 = "0.22"
dirs = "7"
jiff = "0.2"
rand = "0.10"
serde = { workspace = true }
# Keep the order of keys in the apps' settings files Postrinch changes.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml_edit = "0.25"
tracing = { workspace = true }

[dev-dependencies]
postrinch-store = { workspace = true }
tempfile = { workspace = true }
