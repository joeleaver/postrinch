[package]
name = "postrinch-render"
description = "Postrinch's mail rendering: a message's best part, parsed and sanitized, ready for rinch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rinch-html = { workspace = true }
base64 = "0.22"
mail-parser = "1.0"
jiff = "0.2"
postrinch-model = { workspace = true }
# OFSCP bodies (src/social): CommonMark, without the binary's getopts.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# Bare web addresses in a body's text made links.
linkify = "0.12.0"
# The tokenizer that reads a cleaned body back (social/finish.rs): the
# version rinch-html is on, so no second copy.
html5ever = "0.40"
