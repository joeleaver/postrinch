[package]
name = "postrinch-store"
description = "Postrinch's local store: the rhypedb schema, every read and write of it, and the raw-message blobs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
postrinch-model = { workspace = true }
postrinch-rules = { workspace = true }
rhypedb-engine = { workspace = true }
rhypedb-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[features]
# Write failures a test can program (`Store::fail_updates`), for the tests
# of the crates that use the store. Never enabled in the app.
faults = []

[dev-dependencies]
tempfile = { workspace = true }
