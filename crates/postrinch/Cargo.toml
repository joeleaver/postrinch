[package]
name = "postrinch"
description = "Postrinch, the window: an agent-first desktop mail client on rinch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
postrinch-agents = { workspace = true }
postrinch-commands = { workspace = true }
postrinch-discover = { workspace = true }
postrinch-log = { workspace = true }
postrinch-model = { workspace = true }
postrinch-render = { workspace = true }
postrinch-rules = { workspace = true }
postrinch-store = { workspace = true }
postrinch-sync = { workspace = true }
postrinch-update = { workspace = true }
base64 = "0.22"
dark-light = "3"
dirs = "7"
jiff = "0.2"
open = "5"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
rinch = { workspace = true, features = ["desktop", "gpu", "components", "theme", "clipboard", "html", "file-dialogs", "notifications"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# rinch's debug server, for driving the window from tools while developing.
# It shows the window's contents, mail included, to any local process, so it
# is never on in a build for use.
debug = ["rinch/debug"]

[dev-dependencies]
postrinch-mailtest = { path = "../postrinch-mailtest" }
tempfile = { workspace = true }
