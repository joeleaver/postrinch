[package]
name = "postrinch"
description = "Postrinch, the window: an agent-first desktop mail client on rinch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
postrinch-agents = { workspace = true }
postrinch-commands = { workspace = true }
postrinch-model = { workspace = true }
postrinch-store = { workspace = true }
postrinch-sync = { workspace = true }
postrinch-update = { workspace = true }
dark-light = "3"
dirs = "7"
jiff = "0.2"
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
rinch = { git = "https://github.com/joeleaver/rinch.git", features = ["desktop", "components", "theme", "clipboard"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# rinch's debug server, for driving the window from tools while developing.
# It shows the window's contents, mail included, to any local process, so it
# is never on in a build for use.
debug = ["rinch/debug"]
